name: Build and deploy the atlas

# Builds data.json from the workbook in Data/ and publishes docs/ to GitHub Pages.
# Nothing is committed back to main (main is protected), so data.json is built
# fresh on every deploy instead of being stored in the repo.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# On a pull request it builds only, so you can check the summary before merging.
on:
  push:
    branches: [main]
    paths:
      - "Data/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/build-data.yml"
  pull_request:
    paths:
      - "Data/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/build-data.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, to find the last commit that touched the workbook

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Find the workbook
        id: wb
        run: |
          shopt -s nullglob
          files=(Data/*.xlsx)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected exactly one .xlsx in Data/, found ${#files[@]}"; exit 1
          fi
          echo "path=$(realpath "${files[0]}")" >> "$GITHUB_OUTPUT"

      - name: Clean the workbook and build data.json
        run: |
          mkdir -p build
          cp Data/routes.json build/
          cd build
          python ../scripts/prep.py "${{ steps.wb.outputs.path }}" rows.pkl
          python ../scripts/build_data.py "${{ steps.wb.outputs.path }}"

      - name: Explain anchors and chain cables
        working-directory: build
        run: |
          python ../scripts/build_data.py "${{ steps.wb.outputs.path }}" --explain "Anchors" | tee explain.txt
          { echo "### SITC categories: anchors and chain cables"; echo '```'; cat explain.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the last commit that changed the workbook
        run: |
          SHA=$(git log -1 --format=%H -- "Data/*.xlsx")
          DATE=$(git log -1 --format=%cI -- "Data/*.xlsx")
          python - "$SHA" "$DATE" "${{ github.server_url }}/${{ github.repository }}" <<'PY'
          import json, sys
          sha, date, repo = sys.argv[1:4]
          d = json.load(open('build/data.json'))
          if sha:
              d['source']['commit'] = {'sha': sha, 'date': date, 'url': f'{repo}/commit/{sha}'}
          json.dump(d, open('build/data.json', 'w'), separators=(',', ':'))
          PY

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp build/data.json _site/data.json
          touch _site/.nojekyll
          echo "### data.json built" >> "$GITHUB_STEP_SUMMARY"
          python -c "import json;d=json.load(open('_site/data.json'));print('Entries:',len(d['entries']),'| Years:',d['years'])" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
